              External: <a href="https://www.google.com">Google external link</a><br>
              Internal (unmanaged): <a href="/about-cancer">About Cancer internal link</a><br>
              Internal (managed): <a data-entity-substitution="canonical" data-entity-type="node" data-entity-uuid="#process" data-cgov-yaml-query-type="cgov_home_landing" data-cgov-yaml-query-title="About Cancer">Managed internal link</a><br>
