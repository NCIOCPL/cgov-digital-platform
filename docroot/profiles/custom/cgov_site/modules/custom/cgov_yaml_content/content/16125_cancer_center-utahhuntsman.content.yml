    - format: "ncids_full_html"
      value: |
        <p>The Wake Forest Baptist Comprehensive Cancer Center (WFBCCC) became an NCI-Designated Cancer Center in 1974. Offering nine cancer care locations across the Wake Forest Health Network, the center provides access to cancer care and expertise to the Piedmont and southern Appalachian region, an area of 58 contiguous counties in North Carolina, Virginia, and West Virginia. This region has significant health disparities compared with national averages.</p>
         <br />
