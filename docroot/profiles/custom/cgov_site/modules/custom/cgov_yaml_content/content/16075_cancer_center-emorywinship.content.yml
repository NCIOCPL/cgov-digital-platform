  body:
    - format: "full_html"
      value: |
        <p>Winship first received its NCI designation in 2009 and earned NCI-Designated Comprehensive Cancer Center status in 2017. Winship Cancer Institute of Emory University is at the forefront of cancer research and discovery and is the only NCI-Designated Comprehensive Cancer Center in the state of Georgia.</p>
         <br />
        <p><i>* This profile was provided by the Duke Cancer Institute.</i></p>
