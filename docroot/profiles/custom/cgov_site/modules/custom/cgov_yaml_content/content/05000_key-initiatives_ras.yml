##### Promo Image #####
- entity: "media"
  bundle: "cgov_image"
  name: "RAS Promo"
  langcode: en
  status: 1
  moderation_state:
    value: 'published'
  field_media_image:
    - '#process':
        callback: 'file'
        args:
          - 'image'
          - type: 'module'
            filename: 'ras-thumb.jpg'
      alt: ""
  ##### End Promo Image #####

- entity: "node"
  type: "cgov_mini_landing"
  langcode: en
  status: 1
  moderation_state:
    value: 'published'
  title: "The RAS Initiative"
  field_page_description:
    value: "NCI established the RAS Initiative to explore innovative approaches for attacking the proteins encoded by mutant forms of the KRAS gene and to ultimately create effective, new therapies."
  field_browser_title:
    value: "The RAS Initiative"
## This is the default URL
#  field_pretty_url:
#    value: ""
  field_site_section:
    - '#process':
        callback: 'reference'
        args:
          - 'taxonomy_term'
          - vid: 'cgov_site_sections'
            computed_path: '/research/key-initiatives/ras'
  field_banner_image:
    - '#process':
        callback: 'file'
        args:
          - 'image'
          - type: 'module'
            filename: 'RAS-banner.jpg'
      alt: ''
