## Tests:
# Mini Landing Page (converted from Cancer Research Page)
- entity: "node"
  type: "cgov_mini_landing"
  langcode: en
  status: 1
  moderation_state:
    value: "published"
  status__ES:
    value: 1
  moderation_state__ES:
    value: "published"
  title: "Breast Cancer Research"
  title__ES:
    value: "Investigación sobre el cáncer de seno (mama)"
  field_page_description:
    value: "Find research articles on breast cancer, which may include news stories, clinical trials, blog posts, and descriptions of active studies."
  field_page_description__ES:
    value: "Spanish meta description"
  field_card_title:
    value: "Breast Cancer Research"
  field_card_title__ES:
    value: "Investigación sobre el cáncer de seno (mama)"
  field_browser_title:
    value: "Breast Cancer Research"
  field_browser_title__ES:
    value: "Investigación sobre el cáncer de seno (mama)"
  field_site_section:
    - "#process":
        callback: "reference"
        args:
          - "taxonomy_term"
          - vid: "cgov_site_sections"
            computed_path: "/types/breast"
  field_pretty_url:
    value: "research"
  field_site_section__ES:
    - "#process":
        callback: "reference"
        args:
          - "taxonomy_term"
          - vid: "cgov_site_sections"
            computed_path: "/tipos/seno"
  field_pretty_url__ES:
    value: "investigacion"
  field_mlp_page_style:
    - value: "ncids_default"
  # Spanish inherits these list references, matching the original CRLP.
  field_landing_contents:
    - entity: "paragraph"
      type: "cgov_list"
      field_list_item_style:
        - value: "ncids_list_item_title_desc_date"
      field_list_items:
        - entity: "paragraph"
          type: "cgov_internal_link"
          field_internal_link:
            - target_type: "node"
              "#process":
                callback: "reference"
                args:
                  - "node"
                  - type: "cgov_article"
                    title: "Learning to Relax"
        - entity: "paragraph"
          type: "cgov_internal_link"
          field_internal_link:
            - target_type: "node"
              "#process":
                callback: "reference"
                args:
                  - "node"
                  - type: "cgov_article"
                    title: "Feelings and Cancer"
        - entity: "paragraph"
          type: "cgov_external_link"
          field_override_title:
            - value: "External Link Title"
          field_external_link:
            - uri: "https://www.google.com"
        - entity: "paragraph"
          type: "cgov_internal_link"
          field_internal_link:
            - target_type: "node"
              "#process":
                callback: "reference"
                args:
                  - "node"
                  - type: "cgov_blog_post"
                    title: "HTAN: Mapping Tumors across Space and Time Using Cutting-Edge Technologies"
        - entity: "paragraph"
          type: "cgov_internal_link"
          field_internal_link:
            - target_type: "node"
              "#process":
                callback: "reference"
                args:
                  - "node"
                  - type: "cgov_blog_post"
                    title: "Vitamin D Supplements Don’t Reduce Cancer Incidence, Trial Shows"
        - entity: "paragraph"
          type: "cgov_internal_link"
          field_internal_link:
            - target_type: "node"
              "#process":
                callback: "reference"
                args:
                  - "node"
                  - type: "cgov_press_release"
                    title: "Cetuximab with radiation found to be inferior to standard treatment in HPV-positive oropharyngeal cancer"
        ## Media Links
        - entity: "paragraph"
          type: "cgov_media_link"
          field_media_link:
            - target_type: "media"
              "#process":
                callback: "reference"
                args:
                  - "media"
                  - bundle: "cgov_video"
                    name: "Colorectal Cancer Screening: What to Expect"
        - entity: "paragraph"
          type: "cgov_media_link"
          field_media_link:
            - target_type: "media"
              "#process":
                callback: "reference"
                args:
                  - "media"
                  - bundle: "cgov_video"
                    name: "Colorectal Cancer Screening: What to Expect"
          field_override_title:
            - value: "Media Link Video Override Title"
          field_override_list_description:
            - value: "Media Link Video Override Description"
          field_override_image_promotional:
            - target_type: "media"
              "#process":
                callback: "reference"
                args:
                  - "media"
                  - bundle: "cgov_image"
                    name: "Override Placeholder"
        - entity: "paragraph"
          type: "cgov_media_link"
          field_media_link:
            - target_type: "media"
              "#process":
                callback: "reference"
                args:
                  - "media"
                  - bundle: "cgov_infographic"
                    name: "NCI at a Glance Infographic"
        - entity: "paragraph"
          type: "cgov_media_link"
          field_media_link:
            - target_type: "media"
              "#process":
                callback: "reference"
                args:
                  - "media"
                  - bundle: "cgov_infographic"
                    name: "NCI at a Glance Infographic"
          field_override_title:
            - value: "Media Link Infographic Override Title"
          field_override_list_description:
            - value: "Media Link Infographic Override Description"
          field_override_image_promotional:
            - target_type: "media"
              "#process":
                callback: "reference"
                args:
                  - "media"
                  - bundle: "cgov_image"
                    name: "Override Placeholder"
        - entity: "paragraph"
          type: "cgov_media_link"
          field_media_link:
            - target_type: "media"
              "#process":
                callback: "reference"
                args:
                  - "media"
                  - bundle: "cgov_file"
                    name: "Test PDF File name"
        - entity: "paragraph"
          type: "cgov_media_link"
          field_media_link:
            - target_type: "media"
              "#process":
                callback: "reference"
                args:
                  - "media"
                  - bundle: "cgov_file"
                    name: "Test PDF File name"
          field_override_title:
            - value: "Media Link File Override Title"
          field_override_list_description:
            - value: "Media Link File Override Description"
          field_override_image_promotional:
            - target_type: "media"
              "#process":
                callback: "reference"
                args:
                  - "media"
                  - bundle: "cgov_image"
                    name: "Override Placeholder"
  field_date_posted:
    value: "2019-04-24"
  field_date_reviewed:
    value: "2019-04-24"
  field_date_updated:
    value: "2019-04-24"
  field_date_display_mode:
    value: "posted"

