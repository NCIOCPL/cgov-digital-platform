- entity: node
  type: pdq_drug_information_summary
  status: 1
  langcode: en
  title: 'Bevacizumab'
  field_browser_title: 'Bevacizumab'
  moderation_state:
    value: published
  field_site_section:
    - '#process':
        callback: 'reference'
        args:
          - 'taxonomy_term'
          - vid: 'cgov_site_sections'
            computed_path: '/about-cancer/treatment/drugs'
  field_pretty_url:
    value: bevacizumab
  field_pdq_cdr_id:
    value: 487564
  field_date_posted:
    value: '2006-10-05'
  field_date_updated:
    value: '2018-08-03'
  field_date_reviewed:
    value: '2018-08-03'
  field_date_display_mode:
    - value: 'posted'
    - value: 'updated'
  field_page_description:
    value: 'This page contains brief information about bevacizumab and a collection of links to more information about the use of this drug, research results, and ongoing clinical trials.'
  field_public_use:
    value: 0
  field_drug_info_type:
    - value: 'single'
  field_pdq_audio_id:
    value: 707697
  field_pdq_pronunciation_key:
    value: beh-vuh-SIH-zoo-mab
  field_intro_text:
    - format: simple
      value: |
        <p>This page contains brief information about bevacizumab and a collection of links to more information about the use of this drug, research results, and ongoing clinical trials.</p>
  field_us_brand_name:
    - value: "Avastin"
    - value: "Mvasi"
  field_fda_drug_label_url:
    - uri: 'https://dailymed.nlm.nih.gov/dailymed/search.cfm?labeltype=all&query=BEVACIZUMAB&pagesize=20&page=1'
  field_article_body:
    - entity: paragraph
      type: body_section
      field_body_section_heading:
        - format: simple
          value: 'Use in Cancer'
      field_body_section_content:
        - format: ncids_full_html
          value: |
            <p id="_8">Bevacizumab is approved to be used alone or with other <nci-definition data-gloss-id="348921" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">drugs</nci-definition> to treat:</p><ul id="_9"><li><strong><nci-definition data-gloss-id="444973" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">Cervical cancer</nci-definition></strong> that has not gotten better with other treatment, has spread to other parts of the body, or has come back. It is used with <nci-definition data-gloss-id="45258" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">paclitaxel</nci-definition> and either <nci-definition data-gloss-id="45230" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">cisplatin</nci-definition> or <nci-definition data-gloss-id="507692" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">topotecan hydrochloride</nci-definition>. This use is approved for the Alymsys, Avastin, Mvasi, and Zirabev brands of bevacizumab.</li><li><strong><nci-definition data-gloss-id="444983" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">Colorectal cancer</nci-definition></strong> that has spread to other parts of the body.  It is used:<ul id="_12"><li>With fluorouracil as the first or second treatment.</li><li>With  a <nci-definition data-gloss-id="386207" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">fluoropyrimidine</nci-definition> and either <nci-definition data-gloss-id="635811" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">irinotecan hydrochloride</nci-definition> or <nci-definition data-gloss-id="45465" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">oxaliplatin</nci-definition> as the second treatment in patients whose disease has gotten worse after therapy that included bevacizumab.</li></ul> This use is approved for the Alymsys, Avastin, Mvasi, and Zirabev brands of bevacizumab.</li><li><strong><nci-definition data-gloss-id="45698" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">Glioblastoma</nci-definition></strong> (a type of brain <nci-definition data-gloss-id="45333" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">cancer</nci-definition>) that has come back. It is used in adults. This use is approved for the Alymsys, Avastin, Mvasi, and Zirabev brands of bevacizumab.</li><li><strong><nci-definition data-gloss-id="46363" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">Hepatocellular carcinoma</nci-definition></strong> (a type of <nci-definition data-gloss-id="44242" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">liver cancer</nci-definition>) that has spread to other parts of the body or cannot be removed by surgery. It is used with <nci-definition data-gloss-id="781154" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">atezolizumab</nci-definition> in patients who have not received <nci-definition data-gloss-id="45922" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">systemic therapy</nci-definition>. This use is approved for the Avastin brand of bevacizumab.</li><li><strong>Nonsquamous <nci-definition data-gloss-id="45323" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">non-small cell lung cancer</nci-definition></strong> that is has spread, cannot be removed by surgery, or has come back. It is used with <nci-definition data-gloss-id="45182" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">carboplatin</nci-definition> and <nci-definition data-gloss-id="45258" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">paclitaxel</nci-definition> as the first therapy. This use is approved for the Alymsys, Avastin, Mvasi, and Zirabev brands of bevacizumab.</li><li><strong><nci-definition data-gloss-id="46768" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">Ovarian epithelial</nci-definition>,</strong><strong><nci-definition data-gloss-id="755773" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">fallopian tube</nci-definition>,</strong> or <strong><nci-definition data-gloss-id="386215" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">primary peritoneal cancer</nci-definition>.</strong> It is used:<ul id="_14"><li>With carboplatin and paclitaxel and then alone in patients with <nci-definition data-gloss-id="45901" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">stage III</nci-definition>, <nci-definition data-gloss-id="45902" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">stage IV</nci-definition>, or recurrent cancer. It is given after surgery. This use is approved for the Avastin, Mvasi, and Zirabev brands of bevacizumab.</li><li>With paclitaxel, <nci-definition data-gloss-id="560136" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">doxorubicin hydrochloride liposome</nci-definition>, or topotecan hydrochloride in patients whose cancer has come back, does not respond to platinum chemotherapy, and has been treated with  up to two types of chemotherapy. This use is approved for the Alymsys, Avastin, Mvasi, and Zirabev brands of bevacizumab.</li><li>With carboplatin and paclitaxel or carboplatin and <nci-definition data-gloss-id="508951" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">gemcitabine hydrochloride</nci-definition> and then alone in patients whose cancer responds to platinum chemotherapy and has come back. This use is approved for the Avastin, Mvasi, and Zirabev brands of bevacizumab.</li></ul> </li><li><strong><nci-definition data-gloss-id="661352" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">Renal cell carcinoma</nci-definition></strong> (a type of kidney cancer) that has spread to other parts of the body. It is used with <nci-definition data-gloss-id="45324" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">interferon</nci-definition> alpha. This use is approved for the Alymsys, Avastin, Mvasi, and Zirabev brands of bevacizumab.</li></ul><p id="_10">Bevacizumab is also being studied in the treatment of other types of cancer.</p>
    - entity: paragraph
      type: body_section
      field_body_section_heading:
        - format: simple
          value: 'More About Bevacizumab'
      field_body_section_content:
        - format: ncids_full_html
          value: |
            <p id="_Dict_1"><a href="https://www.cancer.gov/publications/dictionaries/cancer-drug/def/43234">Definition from the NCI Drug Dictionary</a> - Detailed scientific definition and other names for this drug.</p><p id="_About_8.39">MedlinePlus Information on <a href="https://medlineplus.gov/druginfo/meds/a607001.html">Bevacizumab </a> - A lay language summary of important information about this drug that may include the following:</p><ul id="_About_9.40"><li>warnings about this drug,</li><li>what this drug is used for and how it is used,</li><li>what you should tell your doctor before using this drug,</li><li>what you should know about this drug before using it, </li><li>other drugs that may interact with this drug, and</li><li>possible side effects.  </li></ul><p id="_About_10.41">Drugs are often studied to find out if they can help treat or prevent conditions other than the ones they are approved for.  This patient information sheet applies only to approved uses of the drug.  However, much of the information may also apply to unapproved uses that are being studied.</p>
    - entity: paragraph
      type: body_section
      field_body_section_heading:
        - format: simple
          value: 'Clinical Trials Accepting Patients'
      field_body_section_content:
        - format: ncids_full_html
          value: |
            <p id="_ClinicalTrial_2"><a href="https://www.cancer.gov/research/participate/clinical-trials/intervention/C2039">Find Clinical Trials for Bevacizumab</a> - Check for trials from NCI&apos;s list of cancer clinical trials now accepting patients.</p>
  field_related_resources:
    - entity: paragraph
      type: cgov_external_link
      field_override_title:
        - value: 'Drug Regimen Boosts Survival of People with Advanced Colorectal Cancer'
      field_external_link:
        - uri: 'https://www.cancer.gov/news-events/cancer-currents-blog/2023/avastin-lonsurf-improves-survival-colorectal-cancer'
    - entity: paragraph
      type: cgov_external_link
      field_override_title:
        - value: 'Targeted Cancer Therapies'
      field_external_link:
        - uri: 'https://www.cancer.gov/about-cancer/treatment/types/targeted-therapies'
    - entity: paragraph
      type: cgov_external_link
      field_override_title:
        - value: 'Monoclonal Antibodies'
      field_external_link:
        - uri: 'https://www.cancer.gov/about-cancer/treatment/types/immunotherapy/monoclonal-antibodies'


