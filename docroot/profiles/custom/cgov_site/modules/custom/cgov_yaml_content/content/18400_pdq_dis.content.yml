  field_public_use:
    value: 0
  field_drug_info_type:
    - value: 'combo'
  field_intro_text:
    - format: simple
      value: |
        <p>This page contains brief information about the drug combination called BEP. The drugs in the combination are listed, and links to individual drug summaries are included.</p>
  field_drugs_in_combination:
    - format: "ncids_streamlined_no_headings"
      value: |
        <ul class="usa-list usa-list--unstyled">
            <li>
                <strong>B</strong> <a class="usa-link" href="https://www.cancer.gov/about-cancer/treatment/drugs/bleomycin">Bleomycin</a>
            </li>
            <li>
                <strong>E</strong> <a class="usa-link" href="https://www.cancer.gov/about-cancer/treatment/drugs/etoposidephosphate">Etoposide Phosphate</a>
            </li>
            <li>
                <strong>P</strong> <a class="usa-link" href="https://www.cancer.gov/about-cancer/treatment/drugs/cisplatin">Cisplatin</a> (Platinol)
            </li>
        </ul>
        <p>
          <nci-definition data-gloss-id="45214" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">Chemotherapy</nci-definition> is often given as a <nci-definition data-gloss-id="45650" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">combination</nci-definition> of <nci-definition data-gloss-id="348921" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">drugs</nci-definition>. Combinations usually work better than single drugs because different drugs kill <nci-definition data-gloss-id="45333" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">cancer</nci-definition> cells in different ways.
        </p>
  field_article_body:
    - entity: paragraph
      type: body_section
      field_body_section_heading:
        - format: simple
          value: 'Use in Cancer'
      field_body_section_content:
        - format: ncids_full_html
          value: |
            <p id="_8">BEP is used to treat:</p><ul id="_9"><li><strong><nci-definition data-gloss-id="446560" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">Ovarian germ cell tumors</nci-definition></strong> that are <nci-definition data-gloss-id="45772" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">malignant</nci-definition>.</li><li><strong><nci-definition data-gloss-id="695185" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">Testicular germ cell tumors</nci-definition></strong> that are malignant.</li></ul><p id="_10">This combination may also be used with other drugs or treatments or to treat other types of cancer.</p>
    - entity: paragraph
      type: body_section
      field_body_section_heading:
        - format: simple
          value: 'More About BEP'
      field_body_section_content:
        - format: ncids_full_html
          value: |
            <p id="_Dict_1"><a href="https://www.cancer.gov/publications/dictionaries/cancer-drug/def/656990">Definition from the NCI Drug Dictionary</a> - Detailed scientific definition and other names for this drug.</p>


