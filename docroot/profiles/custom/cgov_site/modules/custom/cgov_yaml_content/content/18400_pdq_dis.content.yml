  field_us_brand_name:
    - value: "Blincyto"
  field_fda_drug_label_url:
    - uri: 'https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=38b482a8-960b-4591-9857-5031ecb830aa&audience=consumer'
  field_article_body:
    - entity: paragraph
      type: body_section
      field_body_section_heading:
        - format: simple
          value: 'Use in Cancer'
      field_body_section_content:
        - format: ncids_full_html
          value: |
            <p id="_2">Blinatumomab
                     is approved
                     to treat:</p><ul id="_5"><li><strong><nci-definition data-gloss-id="543504" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">B-cell acute lymphoblastic leukemia</nci-definition></strong> that is CD19 positive in adults and children aged 1 month and older. It is used:<ul id="_6"><li>in certain patients with cancer that is in the first or second <nci-definition data-gloss-id="45651" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">complete remission</nci-definition></li><li>in patients with cancer that has come back or did not respond to treatment</li><li>in certain patients with cancer that does not have the <nci-definition data-gloss-id="44179" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">Philadelphia chromosome</nci-definition> and who are in the  <nci-definition data-gloss-id="45654" data-gloss-dictionary="Cancer.gov" data-gloss-audience="Patient" data-gloss-lang="en">consolidation</nci-definition> phase of chemotherapy</li></ul></li></ul><p id="_4">Blinatumomab
                     is also being studied in the treatment of other types of
                     cancer.</p>
    - entity: paragraph
      type: body_section
      field_body_section_heading:
        - format: simple
          value: 'More About Blinatumomab'
      field_body_section_content:
        - format: ncids_full_html
          value: |
            <p id="_Dict_1"><a href="https://www.cancer.gov/publications/dictionaries/cancer-drug/def/487684">Definition from the NCI Drug Dictionary</a> - Detailed scientific definition and other names for this drug.</p><p id="_About_8.60">MedlinePlus Information on <a href="https://medlineplus.gov/druginfo/meds/a614061.html">Blinatumomab</a> - A lay language summary of important information about this drug that may include the following:</p><ul id="_About_9.61"><li>warnings about this drug,</li><li>what this drug is used for and how it is used,</li><li>what you should tell your doctor before using this drug,</li><li>what you should know about this drug before using it, </li><li>other drugs that may interact with this drug, and</li><li>possible side effects.  </li></ul><p id="_About_10.62">Drugs are often studied to find out if they can help treat or prevent conditions other than the ones they are approved for.  This patient information sheet applies only to approved uses of the drug.  However, much of the information may also apply to unapproved uses that are being studied.</p>
    - entity: paragraph
      type: body_section
      field_body_section_heading:
        - format: simple
          value: 'Clinical Trials Accepting Patients'
      field_body_section_content:
        - format: ncids_full_html
          value: |
            <p id="_ClinicalTrial_2"><a href="https://www.cancer.gov/research/participate/clinical-trials/intervention/C62528">Find Clinical Trials for Blinatumomab</a> - Check for trials from NCI&apos;s list of cancer clinical trials now accepting patients.</p>
  field_related_resources:
    - entity: paragraph
      type: cgov_external_link
      field_override_title:
        - value: 'Blinatumomab Boosts Chemotherapy as Initial Treatment for Some Kids with ALL'
      field_external_link:
