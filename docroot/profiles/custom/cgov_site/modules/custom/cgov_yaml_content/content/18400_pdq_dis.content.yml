      field_external_link:
        - uri: 'https://www.cancer.gov/news-events/cancer-currents-blog/2023/blinatumomab-infant-leukemia-survival'
    - entity: paragraph
      type: cgov_external_link
      field_override_title:
        - value: 'Trial Suggests Expanded Role for Blinatumomab in Treating ALL'
      field_external_link:
        - uri: 'https://www.cancer.gov/news-events/cancer-currents-blog/2023/blincyto-leukemia-minimal-residual-disease'
    - entity: paragraph
      type: cgov_external_link
      field_override_title:
        - value: 'Targeted Therapy to Treat Cancer'
      field_external_link:
        - uri: 'https://www.cancer.gov/about-cancer/treatment/types/targeted-therapies'
    - entity: paragraph
      type: cgov_external_link
      field_override_title:
        - value: 'Monoclonal Antibodies'
      field_external_link:
        - uri: 'https://www.cancer.gov/about-cancer/treatment/types/immunotherapy/monoclonal-antibodies'
