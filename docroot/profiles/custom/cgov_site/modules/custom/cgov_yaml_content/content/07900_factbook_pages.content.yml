            <p>
              The National Cancer Institute reports how appropriated funds are spent based on different categories or classifications. These include specific cancer sites, cancer types, diseases related to cancer, as well as types of NCI research mechanisms. The table below identifies funding levels for frequently requested areas of cancer research.
            </p>
            <p class="p1">
              The research areas in this table do not represent the entire NCI research portfolio. Moreover, funding for research areas often overlap. For these reasons, the total for all research areas does not add to the total NCI budget. For example, funding for a clinical trial on breast cancer would be included in both the Breast Cancer and the Clinical Trials lines in the table below. Similarly, a basic cancer research project may be relevant to cervical, uterine, and ovarian cancers, and relevant amounts would be included in the amounts for all three areas of cancer research. NCI provides estimated amounts based on initial budget data before final reconciliation is completed. After this analysis is done, years are marked “Actual”, even though figures often vary slightly from previously reported estimates.
            </p>
            <p>
              <a class="usa-button" href="/media/1183456" data-entity-type="media" data-entity-uuid="f68f24f0-9ba8-4001-91ed-9f4d28dd39f3" data-entity-substitution="canonical">Download the Data</a>
