- entity: 'node'
  type: 'cgov_article'
  langcode: en
  status: 1
  moderation_state:
    value: 'published'
  title: 'Dr. Ruth L. Kirschstein National Research Service Awards (NRSA)'
  field_browser_title:
    value: '2025 NCI Budget Fact Book -  Dr. Ruth L. Kirschstein National Research Service Awards'
  field_page_description:
    value: 'Displays the number of full-time predoctoral and postdoctoral trainee positions.'
  field_card_title:
    value: 'Dr. Ruth L. Kirschstein National Research Service Awards'
  field_card_description:
    value: 'Learn about the program and the types of predoc and postdoc trainees awarded.'
  field_site_section:
    - '#process':
        callback: 'reference'
        args:
          - 'taxonomy_term'
          - vid: 'cgov_site_sections'
            computed_path: '/about-nci/budget/fact-book/extramural-programs/nrsa'
  field_public_use:
    value: 0
  field_date_updated:
    value: "2026-06-04"
  field_date_display_mode:
    - value: 'updated'
  field_article_body:
    - entity: 'paragraph'
      type: 'body_section'
      field_body_section_content:
        - format: 'ncids_full_html'
          value: |
            <p>
              This trainee award program is named after Dr. Ruth L. Kirschstein. She was a polio vaccine researcher and a champion of research training and inclusion of underrepresented individuals in the scientific workforce. Dr. Kirschstein was the first woman to become the director of an NIH institute.
            </p>
            <p>
              The NCI Ruth L. Kirschstein National Research Service Award (NRSA) program helps ensure that there is a diverse pool of highly trained scientists in appropriate scientific disciplines to meet the nation&rsquo;s biomedical, behavioral, and clinical research needs.
            </p>
            <p>
              <a
                href="/node/65887"
                data-entity-type="node"
                data-entity-uuid="2696146c-ef59-4b68-a2b9-419a9da4a801"
                data-entity-substitution="canonical"
                >NRSA for Individual Predoctoral MD/PhD Degree Fellows (F30)</a
              >
            </p>
            <p>
              <a
                href="/node/65973"
                data-entity-type="node"
                data-entity-uuid="8c4ff658-c34f-4532-896a-806cf90558c3"
                data-entity-substitution="canonical"
                >NRSA for Individual Predoctoral Fellows (F31)</a
              >
            </p>
            <p>
              <a
                href="/node/65884"
                data-entity-type="node"
                data-entity-uuid="a9e18875-0722-4319-90d9-e24c9651c533"
                data-entity-substitution="canonical"
                >NRSA for Individual Postdoctoral Fellows (F32)</a
              >
            </p>
            <p>
              <a
