  title: 'Comparison of Dollars, Positions, and Space'
  field_browser_title:
    value: 'Comparison of Dollars, Positions & Space'
  field_page_description:
    value: "Displays obligations against the annual NCI appropriation, the total number of FTEs (work years for NCI employees), and facility space in thousands of square feet."
  field_card_title:
    value: 'Comparison of Dollars, Positions & Space'
  field_card_description:
    value: ''
  field_site_section:
    - '#process':
        callback: 'reference'
        args:
          - 'taxonomy_term'
          - vid: 'cgov_site_sections'
            computed_path: '/about-nci/budget/fact-book/historical-trends/comparison'
  field_public_use:
