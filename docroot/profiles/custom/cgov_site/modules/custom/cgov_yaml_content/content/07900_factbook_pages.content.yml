  field_date_updated:
    value: "2026-06-04"
  field_date_display_mode:
    - value: 'updated'
  field_article_body:
    - entity: 'paragraph'
      type: 'body_section'
      field_body_section_content:
        - format: 'ncids_full_html'
          value: |
            <p>
              This page presents tables comparing NCI's budget, full-time equivalent (FTE) positions, and occupied space spanning fiscal years 2016 through 2025.
            </p>
            <p class="p1">
                NCI's budget is displayed in millions of dollars and includes the Beau Biden Cancer Moonshot℠ funding in Fiscal Years 2017 through 2023, which was the last year of the authorization.<span class="Apple-tab-span">&nbsp;</span>
            </p>
            <p class="p1">
                FTEs are the number of work years for federal employees of the NCI. A work year equals 2,080 hours.<span class="Apple-tab-span">&nbsp;</span>
            </p>
            <p class="p1">
                Space is displayed in thousands of square feet. It excludes NCI-Frederick.
            </p>

            <p><a class="usa-button" href="/about-nci/budget/fact-book/sample-download-data.xlsx">Download the Data</a></p>
