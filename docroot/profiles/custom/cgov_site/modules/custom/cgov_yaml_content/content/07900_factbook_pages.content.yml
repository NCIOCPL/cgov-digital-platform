          value: |
            <p>
              The table below displays NCI staffing levels by type of appointment for fiscal years 2015 through 2025.
            </p>
            <ul>
              <li>
                  Full-time equivalents represent 2,080 hours per person employed.
              </li>
              <li>
                  Full-time and part-time appointments include employees from NIH Employment Reports.
              </li>
              <li>
                  Training fellows include visiting fellows, Cancer Research Training Award (CRTA) fellows, Intramural Research Training Award (IRTA) fellows, biotech fellows, and tech transfers
              </li>
              <li>
                  Total employees include full-time and part-time permanent tours.
              </li>
            </ul>
            <p>
              <a class="usa-button" href="/media/1183556" data-entity-type="media" data-entity-uuid="03c64f26-b696-4312-bd5d-14fa2d8c2090" data-entity-substitution="canonical">Download the Data</a>
