    - format: "ncids_streamlined_no_headings"
      value: |
        <p>
           The 21st Century Cures Act was signed into law in December 2016. It authorized $1.8 billion to fund the Cancer Moonshot over a 7-year period. The goal of the Cancer Moonshot is to accelerate progress in cancer, including prevention and screening. This encompasses a range of activities from cutting edge basic research to widening the uptake of standard of care.
        </p>
        <p>
          More information on Cancer Moonshot can be found by visiting the <a href="/node/1299181" data-entity-type="node" data-entity-uuid="a974f312-68c0-4353-be8c-c0538946afa7" data-entity-substitution="canonical">NCI Cancer Moonshot Initiative page</a>.
        </p>
        <p>
          Information on recent funding opportunity announcements can be found on the <a href="/node/1299181" data-entity-type="node" data-entity-uuid="a974f312-68c0-4353-be8c-c0538946afa7" data-entity-substitution="canonical">NCI Cancer Moonshot Funding Opportunities page</a>.
