# Research Project Grants (RPGs)

- entity: 'node'
  type: 'cgov_article'
  langcode: en
  status: 1
  moderation_state:
    value: 'published'
  title: 'Research Project Grants (RPGs)'
  field_browser_title:
    value: '2025 NCI Budget Fact Book -  Research Project Grants (RPGs)'
  field_page_description:
    value: 'Find RPG summary data, including the number of RPG awards; RPGs requested, awarded, and the success rate; RPG awards by grant activity codes; and RPGs by funding mechanisms.'
  field_card_title:
    value: 'Research Project Grants'
  field_card_description:
    value: 'Find RPG summary data, including the number of RPG awards; RPGs requested, awarded, and the success rate; RPG awards by grant activity codes; and RPGs by funding mechanisms.'
  field_intro_text:
    - format: 'ncids_streamlined_no_headings'
      value: |
        <p>In fiscal year 2025, more than 77.2% of competing funds were used to support grants awarded either within the established payline or through Requests for Applications (RFAs). Of the total competing dollars, 12.4% specifically supported RFA-driven awards. The remaining funds were used to support grants that exceeded the standard funding range.</p>
  field_site_section:
    - '#process':
        callback: 'reference'
        args:
          - 'taxonomy_term'
          - vid: 'cgov_site_sections'
            computed_path: '/about-nci/budget/fact-book/extramural-programs/rpg'
  field_public_use:
    value: 0
  field_date_updated:
    value: "2026-06-04"
  field_date_display_mode:
    - value: 'updated'
  field_article_body:
    - entity: 'paragraph'
      type: 'body_section'
      field_body_section_heading:
        value: 'Number of RPG Awards'
      field_body_section_content:
        - format: 'ncids_full_html'
          value: |
            <p><a class="usa-button" href="/about-nci/budget/fact-book/sample-download-data.xlsx">Download the Data</a></p>
            <drupal-entity
              data-caption=""
              data-embed-button="insert_content_block_content"
              data-entity-embed-display="view_mode:block_content.legacy_highchart"
              data-entity-type="block_content"
              data-entity-uuid="#process"
              data-cgov-yaml-query-type="raw_html_block"
              data-cgov-yaml-query-info="Factbook-number-rpg-awards"
            ></drupal-entity>
            <p>
              Includes Small Business Innovation Research (SBIR) and Small Business Technology Transfer (STTR) Awards.<br>
              FY 2020 - 2023 Includes Cancer Moonshot<sup> </sup>Funding<span class="TrackChangeTextInsertion TrackedChange SCXW12799836 BCX0 TextRun NormalTextRun" data-contrast="auto" xml:lang="EN-US" lang="EN-US">℠</span>
            </p>
            <p>
                The interim FY 2025 R01 payline, which was established while the Institute was operating under a continuing resolution, was rescinded. No official R01 payline was established for FY 2025. In addition, an NIH multi-year funding policy was implemented in that fiscal year that allowed several RPG competing awards to be funded for the entire project period upfront. Due to these policy changes, the FY2025 awards are not comparable to those of previous fiscal years
            </p>
    - entity: 'paragraph'
      type: 'body_section'
      field_body_section_heading:
        value: 'RPGs Summary, Fiscal Years 2024-2025'
      field_body_section_content:
        - format: 'ncids_full_html'
          value: |
            <p>
              Over 77.2% of competing dollars supported grants that were awarded within the established payline, as well as RFAs; the remainder of the funds supported grants that exceeded the fundable range.**&nbsp;<br>
              RFA funds accounted for 12.4% of the FY 2024 competing dollars.&nbsp;<br>
              A total of 964 competing RPGs were funded.
