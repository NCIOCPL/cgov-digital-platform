  field_browser_title:
    value: '2025 NCI Budget Fact Book - Funding for NCI Program Areas'
  field_page_description:
    value: 'Displays the actual NCI obligations by program structure.'
  field_card_title:
    value: 'Program Structure'
  field_card_description:
    value: 'See obligations to major NCI program areas for the 2025 fiscal year.'
  field_site_section:
    - '#process':
        callback: 'reference'
        args:
          - 'taxonomy_term'
          - vid: 'cgov_site_sections'
            computed_path: '/about-nci/budget/fact-book/data/program-structure'
