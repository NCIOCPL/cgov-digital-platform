  field_intro_text:
    - format: 'ncids_streamlined_no_headings'
      value: |
        <p>
          This page displays the number and dollar amount of grant and contract awards by state and country. It includes details for institutions receiving more than $15 million in support from NCI.
        </p>
        <p>
          <strong>Grants </strong>are used when no substantial programmatic involvement is anticipated between NCI and the grant recipient during the performance of the financially-assisted activities. They are also used when NCI has no expectation that it will receive a specified service or product.
        </p>
        <p>
          <strong>Contracts </strong>are used to procure cancer research services and other resources that the federal government needs to advance the NCI cancer research mission.&nbsp;
        </p>
        <p>
          Moving forward, all NCI obligations related to grants and contract awards will be included in this reportfor each fiscal year. According to the National Institutes of Health (NIH)&rsquo;s Office of Extramural Research, the "Count Rules" and associated policy guidelines are updated annually. Funding limits are determined by cost center and division. A value of “0” indicates an award that is funded by another NIH Institute but is co-funded by the NCI.
        </p>
