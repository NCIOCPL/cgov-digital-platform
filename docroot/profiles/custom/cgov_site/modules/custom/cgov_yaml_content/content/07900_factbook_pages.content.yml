  field_article_body:
    - entity: 'paragraph'
      type: 'body_section'
      field_body_section_content:
        - format: 'ncids_full_html'
          value: |
            <h2>
              Cooperative Research and Development Agreements (CRADAs)
            </h2>
            <p>
              As a result of the Federal Technology Transfer Act of 1986 (PL 99-502), government laboratories are authorized to enter into Cooperative Research and Development Agreements (CRADAs) with private sector entities. Under a CRADA, the NIH laboratory can provide personnel, services, facilities, equipment, or other resources; the collaborator can provide funds, personnel, services, facilities, equipment or other material, and/or technical resources. Importantly, the CRADA provides the non-Federal party the option to negotiate an exclusive license to the resultant CRADA Subject Invention(s). The CRADA is the primary legal mechanism for the Federal government to convey such rights in advance of an invention. The agreement has no mandatory length, but it is often written for 1 to 3 years. It is renewable if both parties mutually agree.
            </p>
            <p>
              <a class="usa-button" href="/media/1183451" data-entity-type="media" data-entity-uuid="6e06ea31-38f6-45ae-8564-775adf4289de" data-entity-substitution="canonical">Download the Data</a>
