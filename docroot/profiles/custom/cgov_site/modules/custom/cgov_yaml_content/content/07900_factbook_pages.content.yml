        value: 'RPGs Funding Mechanisms'
      field_body_section_content:
        - format: 'ncids_full_html'
          value: |
            <p><a class="usa-button" href="/about-nci/budget/fact-book/sample-download-data.xlsx">Download the Data</a></p>

            <drupal-entity
              data-caption=""
              data-embed-button="insert_content_block_content"
              data-entity-embed-display="view_mode:block_content.legacy_highchart"
              data-entity-type="block_content"
              data-entity-uuid="#process"
              data-cgov-yaml-query-type="raw_html_block"
              data-cgov-yaml-query-info="Factbook-rpg-funding"
            ></drupal-entity>

            <p>
              The "Other" category includes DP1, DP2, DP5, R00, R37, U01, U19, UH2, UH3, UG3, UA5, R50, UM1, R15, R55, and R56 activities.
            </p>
            <p>
              The interim R01 payline, which was established while the Institute was operating under a continuing resolution, was rescinded. No official R01 payline was established for FY 2025. In addition, an NIH multi-year funding policy was implemented in that fiscal year that allowed several RPG competing awards to be funded upfront for the entire project period. Due to these policy changes, the FY2025 awards are not comparable to those of previous fiscal years.
