## NCI Budget Fact Book
- entity: 'node'
  type: 'cgov_article'
  langcode: en
  status: 1
  moderation_state:
    value: 'published'
  title: 'NCI Budget Fact Book'
  field_browser_title: 'NCI Budget Fact Book'
  field_page_description: 'NCI Budget Fact Book'
  field_card_title: 'NCI Budget Fact Book'
  field_card_description:
    value: 'NCI Budget Fact Book'
  field_site_section:
    - '#process':
        callback: 'reference'
        args:
          - 'taxonomy_term'
          - vid: 'cgov_site_sections'
            computed_path: '/about-nci/budget/fact-book'
  field_public_use:
    value: 0
  field_date_updated:
    value: "2026-06-04"
  field_date_display_mode:
    - value: 'updated'
  field_article_body:
    - entity: 'paragraph'
      type: 'body_section'
      field_body_section_content:
        - format: 'ncids_full_html'
          value: |
            <p>
              This report provides a summary of the distribution of the Fiscal Year 2025 budget among the various National Cancer Institute (NCI) research programs and funding mechanisms. It also presents funding policies influencing grant awards and comparisons with prior year allocations. Additional information on the NCI budget is accessible from the&nbsp;<a href="/node/13019" data-entity-type="node" data-entity-uuid="8b45edc5-d932-4f0f-a630-6f9b47b6a332" data-entity-substitution="canonical" rel="nofollow noopener" target="_blank">NCI home page</a>.
            </p>
            <h2>
              Fiscal Year 2025 Highlights
            </h2>
            <drupal-entity
              data-align=""
              data-caption=""
              data-embed-button="media_entity_embed"
              data-entity-embed-display="view_mode:media.image_display_article_full"
              data-entity-type="media"
              data-entity-uuid="#process"
              data-cgov-yaml-query-bundle="cgov_image"
              data-cgov-yaml-query-name="NCI Fact Book Infographic"
            ></drupal-entity>
            <p>
              Funds available to the NCI totaled $7.2 billion, post inter-departmental and intra-NIH transfers, including $50 million for the Childhood Cancer Data Initiative and $28 million for Childhood Cancer Survivorship, Treatment, Access, and Research (STAR) Act. This reflects no increase from the previous fiscal year.
            </p>
            <p>
                Fiscal year highlights include:
            </p>
            <ul>
              <li data-list-item-id="e83b571bd8a10e037e7f507c1b1e83018">
                  <span>The Childhood Cancer Data Initiative (CCDI) facilitates a connected data infrastructure and integrates multiple data sources to make data work better for patients, clinicians, and researchers.</span>
              </li>
              <li data-list-item-id="e8075f32fa10fd0b2870fa68ccb36ceb8">
                  <span>The Childhood Cancer Survivorship, Treatment, Access, and Research (STAR) Act, which was signed into law in June 2018, authorized funds for NCI to expand existing biorepositories for childhood cancer patients enrolled in NCI-sponsored clinical trials, which collect and maintain relevant clinical, biological, and demographic information on children, adolescents, and young adults. They allow NCI to continue to conduct and support pediatric cancer survivorship research.</span>
              </li>
              <li data-list-item-id="ed34bd85ff7493290f011ee0f9c00b333">
                  <span>Of the total NCI budget obligated, 47.3% of the funds were allocated for Research Project Grants (RPGs).</span>
              </li>
              <li data-list-item-id="e258c9f510b9cf0a0a9135d279ff854cf">
                  <span>The total number of RPGs funded was 5,401, including grants funded through the Small Business Innovation Research (SBIR) &amp; Small Business Technology Transfer (STTR) programs.</span>
              </li>
              <li data-list-item-id="e253c5004afd75b02efb0f1c43905a5b8">
                  <span>Approximately one fifth of the RPGs awarded were new (“Type 1”) or competing renewal (“Type 2” or “Type 4”) awards.</span>
              </li>
              <li data-list-item-id="e721683eef19b6af31572ef5165ba27e9">
                  <span>A total of 964 competing RPGs were funded (excluding grants funded through SBIR &amp; STTR).</span>
              </li>
              <li data-list-item-id="ebc474b327863f399b0aa486cf5435723">
                  <span>One third of the total NCI budget supported ongoing, non-competing (“Type 5”)&nbsp;RPGs.</span>
              </li>
              <li data-list-item-id="e9dfe9b4034865738b98ac015582fce8f">
                  <span>The R01 grants were funded to the 10th percentile for Experienced and New Investigators; the Early-Stage Investigators were funded to the 17th percentile.</span>
              </li>
              <li data-list-item-id="eccece207ae036f2d08571fe79ae6d5a7">
                  <span>R01 Early-Stage Investigators between the 1st and 9th percentiles were converted to R37 awards, giving them the opportunity to extend their research an additional 2 years.</span>
              </li>
              <li data-list-item-id="e15fcbb336cf4b24ec1bb4a34c9ceab9a">
                  <span>SBIR &amp; STTR awards funded 226 grants totaling $181.6 million.</span>
              </li>
              <li data-list-item-id="e735585db4a20ae4852ec43e1d4586fdf">
                  <span>Intramural Research comprised 17.5% of the total NCI budget.</span>
              </li>
            </ul>
            <p>
                The dollar amounts displayed in the NCI Budget Fact Book represent direct appropriated funds only, unless otherwise denoted.
            </p>
            <h3>
                <a href="/about-nci/budget/fact-book/data">NCI Budget Summary Data</a>
            </h3>
            <p>
                This section provides detailed data about funds available to NCI and information on how NCI obligated its funding.
            </p>
            <h3>
                <a href="/about-nci/budget/fact-book/extramural-programs">Extramural Programs</a>
            </h3>
            <p>
                NCI uses most of its budget to fund extramural grants and contracts. This section provides information about extramural funding by grant activity, institution, state, and country.
            </p>
            <h3>
                <a href="/about-nci/budget/fact-book/historical-trends">Historical Trends</a>
            </h3>
            <p>
                This section contains information about the history of NCI appropriations and the Professional Judgment (Bypass) Budget, as well as data on funding trends and staffing levels.
            </p>
            <h3>
                <a href="/about-nci/budget/fact-book/cancer-moonshot" data-entity-type="node" data-entity-uuid="8b71cc8d-0662-4741-8e45-450269ae303d" data-entity-substitution="canonical">Cancer Moonshot - Recent Fiscal Year Funding</a>
            </h3>
            <p>
                This section covers Cancer Moonshot, funded with $1.8 billion over 7 years through the 21st Century Cures Act, signed in December 2016.
            </p>
            <h2>
                About NCI Budget Fact Book&nbsp;
            </h2>
            <p>
                NCI's&nbsp;<a href="/node/867853" data-entity-type="node" data-entity-uuid="5b6312f5-1b41-4e83-b641-a04175f7e621" data-entity-substitution="canonical">Office of Budget and Finance</a>&nbsp;conducts financial analyses and develops financial data and information related to the NCI budget. Created using this data, the NCI Budget Fact Book is an annual report that provides information and data from the previous fiscal year, ranging from NCI program structure to research project grant numbers to extramural programs and historical trends.
            </p>
            <p>
                Email the Office of Budget and Finance at <a href="mailto:nciobfInquiries@mail.nih.gov%20">nciobfInquiries@mail.nih.gov</a> with any questions about the NCI Budget Fact Book.
            </p>
            <h3>
                Previous NCI Budget Fact Books
            </h3>
            <p>
                <a href="/about-nci/budget/fact-book/archive" data-entity-type="node" data-entity-uuid="c3b546f4-9fb7-4244-94dd-3a1b29f93c8b" data-entity-substitution="canonical">Archives of NCI Budget Fact Books back to 1971 are available</a>.
            </p>
            <p>
                Information provided in previous NCI Budget Fact Books can now be found online.
            </p>
            <ul>
              <li>
                <a href="https://oma.od.nih.gov/IC_Organization_Chart/NCI%20Organizational%20Chart.pdf">NCI Organization Chart</a>
              </li>
              <li>
                <a href="/node/14304" data-entity-type="node" data-entity-uuid="c6bd69c7-cda2-42ed-8953-e1c6b530cb2e" data-entity-substitution="canonical">NCI Organization information</a>
              </li>
              <li>
                <a href="/node/923366" data-entity-type="node" data-entity-uuid="ed1cb076-5cd3-48c3-b6fe-b71c973289d8" data-entity-substitution="canonical">Cancer Statistics</a>
              </li>
            </ul>

