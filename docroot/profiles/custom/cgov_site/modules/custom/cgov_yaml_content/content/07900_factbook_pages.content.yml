    - entity: 'paragraph'
      type: 'body_section'
      field_body_section_heading:
        value: 'Comparison of the Professional Judgment Budget, President&apos;s Budget, and Enacted Appropriations'
      field_body_section_content:
        - format: 'ncids_full_html'
          value: |
            <p>
              This graph displays a historical view of the Professional Judgment Budget, the President's Budget, and the Enacted Appropriations
              for the NCI for fiscal years 1976 through 2027. Using the special authority granted in the National Cancer Act, the NCI Director
              submits an annual Professional Judgment Budget directly to the President and Congress. Sometimes referred to as the "Bypass Budget",
              it reflects NCI cancer research priorities and identifies areas of potential investment in cancer research. The President's Budget is
              an annual report prepared by the White House in coordination with federal agencies. It proposes funding levels for the federal
              government, which includes the NIH and NCI, according to the President's priorities. Congress reviews the Professional Judgment
              Budget and the President's Budget and then conducts its own inquiries and hearings. It ultimately develops and passes an appropriations
              bill to fund the government. Once the bill is signed into law by the President, the Enacted Appropriation levels are available for
              NCI's cancer research activities.
            </p>

            <p><a class="usa-button" href="/about-nci/budget/fact-book/sample-download-data.xlsx">Download the Data</a></p>
