            <p>
              <span>To ensure that Cancer Moonshot goals and approaches were grounded in the best science, NCI convened a</span>&nbsp;<a href="/node/1299181" data-entity-type="node" data-entity-uuid="a974f312-68c0-4353-be8c-c0538946afa7" data-entity-substitution="canonical" target="_blank">Blue Ribbon Panel of scientific experts</a>&nbsp;<span>as a working group to the National Cancer Advisory Board. In September of 2016, the Blue Ribbon Panel presented a</span>&nbsp;<a href="/node/1299181" data-entity-type="node" data-entity-uuid="a974f312-68c0-4353-be8c-c0538946afa7" data-entity-substitution="canonical" target="_blank">final report</a>&nbsp;<span>outlining 10 research recommendations. These represent areas that are well positioned to accelerate progress in cancer prevention, diagnosis, treatment, and care.</span>
            </p>

